services:
  redis:
    mem_limit: 512m
    cpus: "0.5"
  ollama:
    mem_limit: 8g
    cpus: "4.0"
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREADS: "4"
  swarmx-python:
    mem_limit: 2g
    cpus: "2.0"
  swarmx-api:
    mem_limit: 1g
    cpus: "1.5"
    environment:
      SWARMX_VIDEO_MAX_CONCURRENT_JOBS: "1"
  swarmx-dashboard:
    mem_limit: 768m
    cpus: "1.0"
    environment:
      SWARMX_VIDEO_MAX_CONCURRENT_JOBS: "1"
