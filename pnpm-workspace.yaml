packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  core-js: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  # AWS Phase-D CDK requires esbuild's install-time binary selection.
  # This is the sole additional lifecycle script permitted at repo root.
  esbuild: true
