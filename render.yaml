# ═══════════════════════════════════════════════════════════════════════════════
# Render Blueprint — The Yap Engine (SwarmXQ)
#
# Existing Service ID: srv-darpk0fpn0mc73dhcri0
# Service Name: the-yap-engine
# Type: worker (Authoritative Background Worker)
# Repository: sabiscore/the-yap-engine
# Branch: main
#
# Processes BullMQ video rendering jobs with single-job concurrency and fail-closed
# local execution gates. Connects to Upstash Redis and Neon durable state.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  - type: worker
    name: the-yap-engine
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@12.6.0 --activate && pnpm install --frozen-lockfile && pnpm -F @swarmx/types build && pnpm -F swarmx-api build
    startCommand: node apps/swarmx-api/dist/apps/swarmx-api/src/workers/start-worker.js

    envVars:
      # ── Core application invariants ──────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: SWARMX_PHASE_ABC_EXECUTION
        value: local
      - key: SWARMX_PHASE_D_EXECUTION
        value: local
      - key: SWARMX_AWS_RENDER_ENABLED
        value: "0"
      - key: SWARMX_EXTERNAL_AI_ENABLED
        value: "0"
      - key: SWARMX_EXTERNAL_AI_MAX_REQUESTS_PER_JOB
        value: "2"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: SWARMX_VIDEO_MAX_CONCURRENT_JOBS
        value: "1"
      - key: OLLAMA_NUM_PARALLEL
        value: "1"
      - key: OLLAMA_MAX_LOADED_MODELS
        value: "1"
      - key: OLLAMA_KEEP_ALIVE
        value: "0"

      # ── Redis / BullMQ (Upstash) ────────────────────────────────────────────
      - key: SWARMX_REDIS_PROVIDER
        value: upstash
      - key: SWARMX_VIDEO_USE_BULLMQ
        value: "1"
      - key: REDIS_URL
        sync: false

      # ── Neon Database ────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: NEON_BRANCH
        value: production
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_DATA_API_URL
        sync: false

      # ── AWS target (Phase D disabled until validated) ────────────────────────
      - key: AWS_REGION
        value: us-east-1
      - key: SWARMX_AWS_RENDER_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ── Authentication / API Token ───────────────────────────────────────────
      - key: SWARMX_VIDEO_API_TOKEN
        sync: false

      # ── Fail-closed video pipeline flags ────────────────────────────────────
      - key: SWARMX_VIDEO_ALLOW_STUB_RENDER
        value: "0"
      - key: SWARMX_VIDEO_ALLOW_SILENT_AUDIO
        value: "0"
      - key: SWARMX_VIDEO_ALLOW_UNSTRUCTURED_INTENT
        value: "0"
      - key: SWARMX_VIDEO_QUEUE_MAX_SIZE
        value: "20"
      - key: SWARMX_VIDEO_JOB_LIMIT_PER_HOUR
        value: "10"
      - key: SWARMX_VIDEO_EXPORT_TTL_DAYS
        value: "7"

      # ── Storage & Logging ───────────────────────────────────────────────────
      - key: SWARMX_HOME
        value: /data/swarmx
      - key: SWARMX_VIDEO_ARTIFACT_DIR
        value: /data/swarmx/video/artifacts
      - key: SWARMX_VIDEO_EXPORT_DIR
        value: /data/swarmx/video/exports
      - key: SWARMX_VIDEO_TEMP_DIR
        value: /data/swarmx/video/tmp
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: Africa/Lagos

    disk:
      name: swarmx-data
      mountPath: /data
      sizeGB: 1

    autoDeploy: true
